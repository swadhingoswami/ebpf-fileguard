name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Portable core (no eBPF) — builds and unit-tests on macOS and Linux.
  # ----------------------------------------------------------------------
  macos-core:
    name: macOS — core build + unit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j3
      - name: Unit tests
        run: ./build/fileguard_tests
      - name: ctest
        run: cd build && ctest --output-on-failure

  linux-core:
    name: Linux — core build + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E timeout 120 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 >/dev/null 2>&1 || true
          sudo -E timeout 240 apt-get install -y g++ cmake pkg-config >/dev/null 2>&1 || true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ./build/fileguard_tests
      - name: ctest
        run: cd build && ctest --output-on-failure

  # ----------------------------------------------------------------------
  # eBPF LSM backend + full integration suite. GitHub's Ubuntu runners ship
  # BTF-enabled kernels (CONFIG_DEBUG_INFO_BTF), so enforcement is testable
  # in CI. If the environment lacks BTF or bpftool, the job skips gracefully.
  # ----------------------------------------------------------------------
  linux-ebpf:
    name: Linux — eBPF backend + integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt on GitHub runners is occasionally slow/hanging; never let it
          # fail the job — the preflight below decides what is available.
          sudo -E timeout 120 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 >/dev/null 2>&1 || true
          sudo -E timeout 240 apt-get install -y g++ clang cmake pkg-config libelf-dev >/dev/null 2>&1 || true
          sudo -E timeout 240 apt-get install -y libbpf-dev >/dev/null 2>&1 || true
          echo "installed: $(g++ --version | head -1) / $(clang --version | head -1) / libbpf: $(pkg-config --modversion libbpf 2>/dev/null || echo missing)"

      - name: Install bpftool (best effort)
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if bpftool version >/dev/null 2>&1; then
            echo "bpftool already functional"
            exit 0
          fi
          # On Ubuntu `bpftool` is a virtual package provided by
          # linux-tools-<version>; the runner kernel version may have no
          # matching package, so install the generic tools and link the real
          # binary (BTF dump / skeleton gen work regardless of running kernel).
          sudo -E timeout 240 apt-get install -y linux-tools-generic >/dev/null 2>&1 || true
          real_bpftool=$(ls /usr/lib/linux-tools-*/bpftool 2>/dev/null | head -1)
          if [ -n "$real_bpftool" ]; then
            sudo ln -sf "$real_bpftool" /usr/local/bin/bpftool
          fi
          if bpftool version >/dev/null 2>&1; then
            echo "bpftool OK: $(bpftool version 2>&1 | head -1)"
          else
            echo "bpftool unavailable (skipping eBPF build)"
          fi

      - name: Preflight — BTF, bpftool, libbpf, bpf LSM enabled
        id: preflight
        run: |
          echo "kernel: $(uname -r)"
          echo "enabled LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '<unreadable>')"
          if [ -r /sys/kernel/btf/vmlinux ] \
             && bpftool version >/dev/null 2>&1 \
             && pkg-config --exists libbpf \
             && grep -q bpf /sys/kernel/security/lsm 2>/dev/null; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure (core only if BTF unavailable)
        run: |
          if [ "${{ steps.preflight.outputs.available }}" = "yes" ]; then
            cmake -S . -B build -DENABLE_EBPF=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          fi

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ./build/fileguard_tests

      - name: Demo setup + integration tests (root, needs eBPF LSM)
        if: steps.preflight.outputs.available == 'yes'
        run: |
          sudo ./scripts/setup-demo.sh
          sudo ./scripts/integration-tests.sh

      - name: Notify skip
        if: steps.preflight.outputs.available == 'no'
        run: |
          echo "::notice::eBPF backend skipped: this runner kernel lacks BTF, bpftool, libbpf, or the bpf LSM is not in CONFIG_LSM (see /sys/kernel/security/lsm). The portable core built and passed unit tests; integration tests require a kernel with eBPF LSM enabled."
